<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonal Kumar | Data Analyst</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* CINEMATIC 3D CSS */
        body {
            margin: 0; padding: 0; background-color: #050505; color: #fff;
            font-family: 'Inter', sans-serif; overflow-x: hidden;
        }
        
        /* 3D Background Effect */
        .bg-glow {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.15) 0%, transparent 40%);
            z-index: -1; pointer-events: none;
        }

        /* Navbar */
        nav {
            display: flex; justify-content: space-between; padding: 30px 50px;
            font-family: 'Syne', sans-serif; font-weight: 700; letter-spacing: 1px;
            position: fixed; width: 100%; box-sizing: border-box; z-index: 100;
            backdrop-filter: blur(10px); background: rgba(5,5,5,0.5);
        }
        nav a { color: #fff; text-decoration: none; margin-left: 20px; font-size: 14px; transition: 0.3s; }
        nav a:hover { color: #60a5fa; }

        /* Hero Section */
        .hero {
            height: 100vh; display: flex; flex-direction: column; justify-content: center;
            align-items: center; text-align: center; perspective: 1000px;
        }
        
        /* 3D Glass Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.05);
            backdrop-filter: blur(20px); padding: 50px 80px; border-radius: 24px;
            transform: rotateX(5deg) rotateY(-5deg); transition: transform 0.5s ease;
            animation: float 6s ease-in-out infinite;
        }
        
        .glass-card:hover {
            transform: rotateX(0deg) rotateY(0deg) scale(1.02);
        }

        /* Profile Image */
        .profile-img {
            width: 160px; height: 160px; border-radius: 50%; object-fit: cover;
            border: 2px solid rgba(96, 165, 250, 0.5); box-shadow: 0 0 30px rgba(59, 130, 246, 0.3);
            margin-bottom: 20px;
        }

        /* Typography */
        h1 {
            font-family: 'Syne', sans-serif; font-size: 4rem; margin: 10px 0;
            background: linear-gradient(90deg, #fff, #60a5fa); -webkit-background-clip: text;
            -webkit-text-fill-color: transparent; letter-spacing: -2px;
        }
        p.role { color: #94a3b8; font-size: 1.2rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 30px; }
        
        /* Floating Animation */
        @keyframes float {
            0% { transform: translateY(0px) rotateX(5deg) rotateY(-5deg); }
            50% { transform: translateY(-15px) rotateX(5deg) rotateY(-5deg); }
            100% { transform: translateY(0px) rotateX(5deg) rotateY(-5deg); }
        }

        /* CTA Button */
        .btn {
            padding: 15px 40px; font-size: 1rem; color: #000; background: #fff;
            text-decoration: none; border-radius: 50px; font-weight: 700;
            transition: 0.3s; display: inline-block; margin-top: 20px;
        }
        .btn:hover { background: #60a5fa; color: #fff; box-shadow: 0 0 20px rgba(96, 165, 250, 0.5); }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <nav>
        <div>SONAL.K</div>
        <div>
            <a href="#">WORK</a>
            <a href="#">ABOUT</a>
            <a href="#">CONTACT</a>
        </div>
    </nav>

    <section class="hero">
        <div class="glass-card">
            <!-- APNI PHOTO KA LINK YAHAN DAALEIN -->
            <img src="https://via.placeholder.com/160" alt="Sonal Kumar" class="profile-img">
            <h1>SONAL KUMAR</h1>
            <p class="role">Data Analyst & BI Specialist</p>
            <a href="#" class="btn">Explore My Work</a>
        </div>
    </section>

</body>
</html>
